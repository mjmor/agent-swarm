# Pinned source artifacts. `uv run agent-swarm acquire` downloads each into
# data/raw/<source id>/<name> and records sha256/size/timestamp in sources/manifest.json.
#
# kind:
#   report_html  - snapshot of the incident write-up itself
#   dataset      - bulk data published alongside a report
#   reference    - third-party material a report cites (official disclosures, blog posts)
#
# manual = true marks artifacts that can't be fetched automatically. `acquire` never
# downloads them; it registers the file if someone saved it at data/raw/<id>/<name>, and
# flags it as a duplicate if it's byte-identical to another artifact.

