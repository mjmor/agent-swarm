[project]
name = "agent-swarm"
version = "0.1.0"
description = "Systematize public AI agent swarm incident datasets and hunt for further rogue agent activity"
authors = [
    { name = "Max Morgan", email = "maxjmorgan@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "tqdm>=4.70.1",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
agent-swarm = "agent_swarm:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbqa>=1.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs downloaded data under data/raw (skipped when absent, e.g. in CI)"]
